<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement Sécurisé | XonoHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=EUR"></script>
    <style>
        .checkout-container { max-width: 500px; margin: 50px auto; background: #1c1e26; padding: 30px; border-radius: 15px; border: 1px solid #3498db; }
        .item-summary { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
        .secure-notice { font-size: 12px; color: #666; text-align: center; margin-top: 20px; }
        #paypal-button-container { margin-top: 20px; }
    </style>
</head>
<body style="background: #0d0e12; color: white; font-family: 'Poppins';">

    <div class="checkout-container">
        <h2 style="text-align: center;">Finaliser la commande</h2>
        
        <div class="item-summary">
            <p style="color: #3498db; font-size: 14px; margin: 0;">Produit sélectionné :</p>
            <h3 id="display-item">Chargement...</h3>
            <div style="font-size: 24px; font-weight: 800; color: #2ecc71;" id="display-price">0.00€</div>
        </div>

        <div id="paypal-button-container"></div>

        <p class="secure-notice">🔒 Paiement sécurisé via PayPal (SSL 256-bit)</p>
    </div>

    <script>
        // 1. Récupérer les infos de l'URL
        const params = new URLSearchParams(window.location.search);
        const itemName = params.get('item') || "Produit";
        const itemPrice = params.get('price') || "0.00";

        document.getElementById('display-item').innerText = itemName;
        document.getElementById('display-price').innerText = itemPrice + "€";

        // 2. Configurer le bouton PayPal
        paypal.Buttons({
            createOrder: function(data, actions) {
                return actions.order.create({
                    purchase_units: [{
                        description: itemName,
                        amount: {
                            currency_code: 'EUR',
                            value: itemPrice // Utilise le prix récupéré dans l'URL
                        }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(function(details) {
                    alert('Transaction réussie ! Merci ' + details.payer.name.given_name + ' pour votre achat.');
                    // Ici, tu peux rediriger vers une page de succès :
                    // window.location.href = "merci.html";
                });
            },
            onError: function(err) {
                console.error('Erreur PayPal :', err);
                alert('Une erreur est survenue lors du paiement.');
            }
        }).render('#paypal-button-container');
    </script>
</body>
</html>
