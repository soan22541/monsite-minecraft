<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paiement Sécurisé | XonoHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .checkout-container { 
            max-width: 500px; 
            margin: 50px auto; 
            background: #1c1e26; 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid #3498db; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .item-summary { 
            background: rgba(0,0,0,0.3); 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        .payment-form label {
            font-size: 14px;
            color: #aaa;
            display: block;
            margin-top: 15px;
        }
        .payment-form input { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0; 
            border-radius: 5px; 
            border: 1px solid #333; 
            background: #0d0e12; 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        .payment-form input:focus {
            border-color: #3498db;
        }
        .secure-notice { font-size: 12px; color: #666; text-align: center; margin-top: 20px; }
        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 15px; 
            color: #3498db; 
            text-decoration: none; 
            font-size: 13px;
        }
    </style>
</head>
<body style="background: #0d0e12; color: white; font-family: 'Poppins';">

    <div class="checkout-container">
        <h2 style="text-align: center;">Finaliser la commande</h2>
        
        <div class="item-summary">
            <p style="color: #3498db; font-size: 14px; margin: 0;">Produit sélectionné :</p>
            <h3 id="display-item">Chargement...</h3>
            <div style="font-size: 24px; font-weight: 800; color: #2ecc71;" id="display-price">0.00€</div>
        </div>

        <form class="payment-form" id="payment-form">
            <label>Nom sur la carte</label>
            <input type="text" placeholder="Jean Dupont" required>
            
            <label>Numéro de carte</label>
            <input type="text" maxlength="19" placeholder="1234 5678 9101 1121" required>
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Expiration</label>
                    <input type="text" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div style="flex: 1;">
                    <label>CVC</label>
                    <input type="text" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="btn-buy" style="margin-top: 25px; cursor: pointer;">PAYER MAINTENANT</button>
        </form>

        <a href="index.html" class="back-link">← Retour au Hub</a>
        <p class="secure-notice">🔒 Paiement sécurisé par cryptage SSL 256-bit</p>
    </div>

    <script>
        // Lecture des paramètres passés par le script.js (item et price)
        const params = new URLSearchParams(window.location.search);
        const itemName = params.get('item');
        const itemPrice = params.get('price');

        // Affichage dynamique
        if (itemName) {
            document.getElementById('display-item').innerText = itemName;
        }
        if (itemPrice) {
            document.getElementById('display-price').innerText = itemPrice + "€";
        }

        // Simulation de validation
        document.getElementById('payment-form').onsubmit = function(e) {
            e.preventDefault();
            alert("Merci pour votre achat de " + (itemName || "grade") + " ! Votre transaction est en cours de traitement.");
            window.location.href = "index.html"; // Retour au hub après achat
        };
    </script>
</body>
</html>
